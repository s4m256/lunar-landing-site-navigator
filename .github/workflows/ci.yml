name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test:infra
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:deploy
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './science[dev]'
      # -ra lists skipped (no cached NAIF kernels) and xfailed (known data findings) tests;
      # xfail_strict makes an unexpectedly passing xfail fail the job so stale markers are removed.
      - run: python -m pytest -ra -o xfail_strict=true
        working-directory: science
      - run: python -m build science
      - name: Smoke test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/lunar-wheel"
          "$RUNNER_TEMP/lunar-wheel/bin/python" -m pip install --no-deps science/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/lunar-wheel/bin/lunar-science"
